name: Parts & Pricing Auto-Update

on:
  schedule:
    # Runs at 02:00 UTC every day
    - cron: '0 2 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit changes back to the repo

jobs:
  run-daily-ingest:
    name: Run Scraping & Pricing Importer
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Scrape External Parts & Pricing
        run: npm run auto:market
        env:
          ROCKAUTO_API_KEY: ${{ secrets.ROCKAUTO_API_KEY }}
          NHTSA_LIMIT: false
          
      - name: Validate New Schema Data
        run: npm run validate
        
      - name: Commit & Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "bot: daily auto-update parts & pricing"
          branch: main
          file_pattern: "data/parts/*.json market-data/*.json"
